name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same version the suite passes on locally
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No API keys are set here on purpose: the suite uses MockLLMClient and
      # mock integrations, so it runs fully offline at no cost.
      - name: Run tests
        run: pytest -v
