<svg width="680" height="988" viewBox="0 0 680 988" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RAG automation agent architecture</title>
<desc>Documents are loaded, chunked, and indexed for hybrid BM25 keyword and TF-IDF vector retrieval; a ChromaDB vector store module exists but is not yet on the query path. A query or event from the demo UI, REST API, or event bus enters RagAgent.run, which writes an audit record on every run. High-urgency runs from the event bus or demo UI auto-escalate to ServiceNow and Power Automate. A matched runbook is proposed and only executes after human approval. Every run returns an answer, citations, triage, and an action plan.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
rect,polygon{fill:#F1EFE8;stroke:#5F5E5A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}
.blue rect{fill:#E6F1FB;stroke:#185FA5}
.coral rect{fill:#FAECE7;stroke:#993C1D}
.purple rect{fill:#EEEDFE;stroke:#534AB7}
text{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2A}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;fill:#5F5E5A}
line,path{stroke:#5F5E5A}
</style>

<g class="gray"><rect x="200" y="40" width="280" height="56" rx="8"/>
<text class="th" x="340" y="63" text-anchor="middle">Documents &amp; cloud storage</text>
<text class="ts" x="340" y="81" text-anchor="middle">PDF, DOCX, HTML, TXT, S3, Blob</text></g>
<line x1="340" y1="96" x2="340" y2="136" marker-end="url(#arrow)"/>

<g class="teal"><rect x="200" y="136" width="280" height="56" rx="8"/>
<text class="th" x="340" y="159" text-anchor="middle">document_loader.py</text>
<text class="ts" x="340" y="177" text-anchor="middle">Normalize to text + metadata</text></g>
<line x1="340" y1="192" x2="340" y2="232" marker-end="url(#arrow)"/>

<g class="teal"><rect x="200" y="232" width="280" height="56" rx="8"/>
<text class="th" x="340" y="255" text-anchor="middle">chunker.py</text>
<text class="ts" x="340" y="273" text-anchor="middle">Sentence-aware overlapping chunks</text></g>
<line x1="340" y1="288" x2="340" y2="322"/>

<g class="blue"><rect x="90" y="322" width="220" height="56" rx="8"/>
<text class="th" x="200" y="345" text-anchor="middle">retriever.py</text>
<text class="ts" x="200" y="363" text-anchor="middle">Hybrid BM25 + TF-IDF</text></g>
<g class="blue"><rect x="370" y="322" width="220" height="56" rx="8" stroke-dasharray="5 4"/>
<text class="th" x="480" y="345" text-anchor="middle">vector_store.py</text>
<text class="ts" x="480" y="363" text-anchor="middle">ChromaDB, not yet on query path</text></g>
<path d="M200 378L200 402L340 402L340 420" fill="none" marker-end="url(#arrow)"/>
<path d="M480 378L480 402L340 402" fill="none" stroke-dasharray="5 4"/>

<g class="purple"><rect x="24" y="420" width="160" height="56" rx="8"/>
<text class="th" x="104" y="443" text-anchor="middle">Query or event</text>
<text class="ts" x="104" y="461" text-anchor="middle">UI, API, event bus</text></g>
<line x1="184" y1="448" x2="208" y2="448" marker-end="url(#arrow)"/>

<g class="blue"><rect x="210" y="420" width="260" height="56" rx="8" stroke-width="1.5"/>
<text class="th" x="340" y="443" text-anchor="middle">agent.py — RagAgent.run()</text>
<text class="ts" x="340" y="461" text-anchor="middle">Redact, answer, triage, plan</text></g>
<line x1="340" y1="476" x2="340" y2="516" marker-end="url(#arrow)"/>

<g class="gray"><rect x="200" y="516" width="280" height="56" rx="8"/>
<text class="th" x="340" y="539" text-anchor="middle">Audit log</text>
<text class="ts" x="340" y="557" text-anchor="middle">Every run, PII already redacted</text></g>
<line x1="340" y1="572" x2="340" y2="612" marker-end="url(#arrow)"/>

<g class="gray"><polygon points="340,612 420,662 340,712 260,662"/>
<text class="ts" x="340" y="666" text-anchor="middle">High urgency?</text></g>
<line x1="420" y1="662" x2="454" y2="662" marker-end="url(#arrow)"/>
<text class="ts" x="426" y="652">yes</text>
<g class="coral"><rect x="456" y="624" width="184" height="76" rx="8"/>
<text class="th" x="548" y="647" text-anchor="middle">Auto-escalation</text>
<text class="ts" x="548" y="666" text-anchor="middle">ServiceNow + Power Automate</text>
<text class="ts" x="548" y="684" text-anchor="middle">Event bus or demo UI</text></g>
<line x1="340" y1="712" x2="340" y2="752" marker-end="url(#arrow)"/>

<g class="gray"><polygon points="340,752 420,802 340,852 260,802"/>
<text class="ts" x="340" y="806" text-anchor="middle">Runbook matched?</text></g>
<line x1="420" y1="802" x2="454" y2="802" marker-end="url(#arrow)"/>
<text class="ts" x="426" y="792">yes</text>
<g class="coral"><rect x="456" y="774" width="184" height="56" rx="8"/>
<text class="th" x="548" y="797" text-anchor="middle">Guided remediation</text>
<text class="ts" x="548" y="815" text-anchor="middle">Human approval, then execute</text></g>
<line x1="340" y1="852" x2="340" y2="892" marker-end="url(#arrow)"/>

<g class="gray"><rect x="200" y="892" width="280" height="56" rx="8"/>
<text class="th" x="340" y="915" text-anchor="middle">Response returned</text>
<text class="ts" x="340" y="933" text-anchor="middle">Answer, citations, triage, plan</text></g>
</svg>
